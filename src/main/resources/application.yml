server:
  # 8080 留给本机 WSL 里的 Apache；8081 被未知提权进程占用；这里用 8082
  port: 8082

spring:
  application:
    name: docqa

  datasource:
    # 127.0.0.1 而不是 localhost：避免 JDBC 先解析到 IPv6 的 ::1 连不上
    url: jdbc:mysql://127.0.0.1:3306/docqa?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: docqa
    password: Docqa@2026
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 学习阶段用 update 自动建表；正式项目应改成 validate 并用 Flyway 管理表结构
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      # 单个文件上限 20MB，单次请求上限 25MB
      max-file-size: 20MB
      max-request-size: 25MB

  # Redis：本地开发用 D:\Redis 起的实例（scripts\start-redis.bat）
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 2s
      # 连接池：不配的话每次都新建连接，高并发下会大量 TIME_WAIT
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

# 自定义配置：JWT
docqa:
  jwt:
    # 密钥必须 >= 32 字节，否则 HS256 会拒绝；正式环境应从环境变量读取，不要提交到仓库
    secret: docqa-jwt-secret-key-please-change-in-production-2026
    issuer: docqa
    # token 有效期（秒），这里 7 天
    expire-seconds: 604800

  upload:
    # 原始文件落盘目录（D 盘，不占系统盘）
    dir: D:/docqa-data/uploads
    # 解析出来的纯文本放这里，后续切分/向量化都读它
    text-dir: D:/docqa-data/texts

  # 文本切分参数
  chunk:
    # 单块最大字符数。500 字会把好几个主题塞进一块，检索精度明显变差；
    # 300 左右对中文技术笔记比较合适，段落边界也不会被破坏
    max-chars: 300
    # 相邻块重叠字符数，防止答案正好卡在块边界被切碎
    overlap: 50

  # 向量化参数
  embedding:
    # 本地哈希向量的维度（换成真实模型后这个值由模型决定）
    dimension: 512

  # 大模型（DeepSeek，OpenAI 兼容接口）
  llm:
    base-url: https://api.deepseek.com
    # 从环境变量读取，绝不写死在这里（否则会随 git 泄漏）
    api-key: ${DEEPSEEK_API_KEY:}
    model: deepseek-chat
    # 问答要稳定，温度取小
    temperature: 0.3
    timeout-seconds: 120
    # 最多拿几段资料拼进提示词
    max-context-chunks: 5

  # 问答结果缓存
  cache:
    # 缓存有效期（秒）。问答答案相对稳定，1 小时合适；
    # 文档重新解析后应该主动失效，目前靠 TTL 兜底
    answer-ttl-seconds: 3600
    # 关掉缓存便于压测对比"有缓存/无缓存"的差异
    enabled: true



